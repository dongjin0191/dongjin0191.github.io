<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#2457c5">
<title>우리끼리 빙고 3판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#18243a;font-family:system-ui,'Malgun Gothic',sans-serif;padding:14px}
.app{max-width:760px;margin:auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 30px #243b6318}
h1{text-align:center;font-size:clamp(25px,6vw,36px);margin:6px 0}.sub{text-align:center;color:#65738a;margin:0 0 16px}
.toolbar,.tabs,.bottom{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
button{border:0;border-radius:11px;padding:12px 14px;font:inherit;font-weight:750;background:#e8eef9;color:#21304a;cursor:pointer}
button.primary{background:#2457c5;color:#fff}button.danger{background:#ffe9e9;color:#a32c2c}
.tabs button{flex:1;min-width:75px}.tabs button.active{background:#2457c5;color:white}
.info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#52617a;font-weight:700;margin:12px 2px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{min-width:0;min-height:76px;border:2px solid #d9e2f2;border-radius:12px;background:#f8faff;padding:4px;display:flex;align-items:center;justify-content:center;position:relative}
.cell input{width:100%;min-width:0;border:0;outline:0;background:transparent;text-align:center;font:700 clamp(12px,3.2vw,17px) system-ui,'Malgun Gothic',sans-serif;color:#18243a;padding:18px 2px 4px;line-height:1.25}
.cell .n{position:absolute;top:4px;left:6px;font-size:10px;color:#8290a5;font-weight:800}
.cell.marked{background:#dff4e8;border-color:#35a56a}.cell.marked input{text-decoration:line-through;color:#28734b}
.cell button{position:absolute;right:3px;top:2px;padding:1px 5px;font-size:12px;background:transparent;color:#9aa6b7;line-height:1.4}
.hint{text-align:center;color:#6b7890;font-size:13px;margin:12px 0}
.result{text-align:center;background:#fff7dd;color:#805600;border-radius:12px;padding:10px;font-weight:800;margin-top:12px;display:none}
@media(max-width:420px){body{padding:7px}.app{padding:12px;border-radius:16px}.grid{gap:4px}.cell{min-height:66px;border-radius:9px}.cell input{font-size:12px}.toolbar button{padding:10px 11px;font-size:13px}}
</style>
</head>
<body><main class="app">
<h1>🎯 우리끼리 빙고</h1><p class="sub">5 × 5 칸 · 직접 쓰고 지우고 · 신나는 3판 게임</p>
<div class="tabs" id="tabs"><button class="active" data-round="0">1판</button><button data-round="1">2판</button><button data-round="2">3판</button></div>
<div class="info"><span id="roundLabel">1판 진행 중</span><span id="count">빙고 0줄</span></div>
<div class="grid" id="grid"></div>
<div class="toolbar">
<button class="primary" id="markMode">칸 표시 모드: 켜짐</button>
<button id="clearMarks">표시 지우기</button>
<button id="clearText">글자 모두 지우기</button>
<button id="shuffle">칸 섞기</button>
</div>
<div class="bottom">
<button id="next">다음 판으로 →</button>
<button class="danger" id="reset">3판 모두 새로 시작</button>
</div>
<div class="result" id="result"></div>
<p class="hint">칸을 눌러 내용을 입력하세요. 오른쪽 위 ×는 해당 칸만 지웁니다.<br>빙고 표시 모드가 켜져 있으면 칸을 눌러 색칠할 수 있습니다.</p>
</main>
<script>
const KEY='our-bingo-3rounds-v1';
let boards=load(),round=0,markMode=true;
function blank(){return Array.from({length:25},()=>({text:'',marked:false}))}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v)&&v.length===3)return v}catch(e){}return [blank(),blank(),blank()]}
function save(){localStorage.setItem(KEY,JSON.stringify(boards))}
const grid=document.getElementById('grid');
function bingoLines(){const a=boards[round],lines=[];for(let r=0;r<5;r++)lines.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)lines.push([0,1,2,3,4].map(r=>r*5+c));lines.push([0,6,12,18,24],[4,8,12,16,20]);return lines}
function countBingo(){return bingoLines().filter(line=>line.every(i=>boards[round][i].marked)).length}
function render(){
 document.getElementById('roundLabel').textContent=(round+1)+'판 진행 중';
 document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('active',i===round));
 grid.innerHTML='';
 boards[round].forEach((cell,i)=>{
  const wrap=document.createElement('div');wrap.className='cell'+(cell.marked?' marked':'');
  const n=document.createElement('span');n.className='n';n.textContent=i+1;wrap.appendChild(n);
  const input=document.createElement('input');input.value=cell.text;input.placeholder='입력';input.setAttribute('aria-label',(i+1)+'번 칸');
  input.addEventListener('input',()=>{cell.text=input.value;save()});
  input.addEventListener('focus',()=>{markMode=false;document.getElementById('markMode').textContent='칸 표시 모드: 꺼짐'});
  wrap.appendChild(input);
  const clear=document.createElement('button');clear.type='button';clear.textContent='×';clear.title='이 칸 지우기';
  clear.addEventListener('click',e=>{e.stopPropagation();cell.text='';cell.marked=false;save();render()});wrap.appendChild(clear);
  wrap.addEventListener('click',e=>{if(e.target===input||e.target===clear)return;if(markMode){cell.marked=!cell.marked;save();render()}else input.focus()});
  grid.appendChild(wrap);
 });
 const n=countBingo();document.getElementById('count').textContent='빙고 '+n+'줄';
 const result=document.getElementById('result');result.style.display=n?'block':'none';result.textContent=n?'🎉 '+n+'줄 빙고! 축하합니다!':'';
 document.getElementById('markMode').textContent='칸 표시 모드: '+(markMode?'켜짐':'꺼짐');
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{round=Number(b.dataset.round);render()}));
document.getElementById('markMode').onclick=()=>{markMode=!markMode;render()};
document.getElementById('clearMarks').onclick=()=>{boards[round].forEach(c=>c.marked=false);save();render()};
document.getElementById('clearText').onclick=()=>{if(confirm('현재 판의 글자를 모두 지울까요?')){boards[round].forEach(c=>{c.text='';c.marked=false});save();render()}};
document.getElementById('shuffle').onclick=()=>{const filled=boards[round].map(c=>c.text).filter(Boolean);if(!filled.length){alert('먼저 칸에 단어를 입력해 주세요.');return}for(let i=filled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filled[i],filled[j]]=[filled[j],filled[i]]}boards[round].forEach((c,i)=>{c.text=filled[i]||'';c.marked=false});save();render()};
document.getElementById('next').onclick=()=>{round=(round+1)%3;render()};
document.getElementById('reset').onclick=()=>{if(confirm('정말 3판을 모두 비우고 새로 시작할까요?')){boards=[blank(),blank(),blank()];round=0;save();render()}};
render();
</script></body></html>
