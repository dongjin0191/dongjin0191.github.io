<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성경 몸으로 말해요 100문항</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;min-height:100vh;display:grid;place-items:center;background:#f2f5fb;color:#253047;font-family:system-ui,'Malgun Gothic',sans-serif}.app{width:min(900px,100%);background:white;padding:clamp(18px,4vw,38px);border-radius:24px;box-shadow:0 12px 40px #22335518}h1{text-align:center;font-size:clamp(26px,4vw,38px)}.sub,.foot{text-align:center;color:#68758a}.bar,.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:14px 0}button{font:inherit;padding:12px 16px;border:0;border-radius:12px;background:#e9eef8;font-weight:700;cursor:pointer}button.main{background:#3158bd;color:white}button:disabled{opacity:.4}.meta{display:flex;justify-content:space-between;flex-wrap:wrap}.card{margin:20px 0;padding:clamp(24px,5vw,48px) 14px;text-align:center;background:#f1f5fc;border:2px dashed #cbd5e7;border-radius:20px}.num{color:#68758a;margin-bottom:14px;font-weight:800}.question{font-size:clamp(25px,5vw,48px);line-height:1.4;font-weight:850;word-break:keep-all}.answer{margin:20px auto 0;padding:14px;background:white;border-radius:12px;color:#3158bd;font-weight:800}.hide{display:none}@media(max-width:520px){.meta{justify-content:center;gap:18px}.actions button{flex:1 1 40%}}</style><body><main class="app"><h1>🎭 성경 몸으로 말해요</h1><p class="sub">교회 모임용 성경 이야기 몸짓 퀴즈 · 100문항</p><div class="bar"><button id="shuffle">문제 섞기</button><button id="reset">처음부터</button></div><div class="meta"><span id="progress"></span><span>맞힌 점수: <b id="score">0</b>점</span></div><section class="card"><div class="num" id="num"></div><div class="question" id="question"></div><div id="answer" class="answer hide"></div></section><div class="actions"><button class="main" id="reveal">정답 보기</button><button id="correct">맞혔어요 +1점</button><button id="prev">이전 문제</button><button class="main" id="next">다음 문제</button></div><p class="foot">진행자는 문제를 읽고 참가자는 말하지 않고 몸짓으로 표현해 보세요!</p></main><script>const QUESTIONS=[{"q":"다윗과 골리앗","ref":"성경 이야기"},{"q":"노아의 방주","ref":"성경 이야기"},{"q":"홍해를 건넌 이스라엘","ref":"성경 이야기"},{"q":"모세의 십계명","ref":"성경 이야기"},{"q":"여리고 성 함락","ref":"성경 이야기"},{"q":"삼손과 두 기둥","ref":"성경 이야기"},{"q":"요나와 큰 물고기","ref":"성경 이야기"},{"q":"다니엘과 사자굴","ref":"성경 이야기"},{"q":"풀무불 속 세 친구","ref":"성경 이야기"},{"q":"에스더와 왕","ref":"성경 이야기"},{"q":"룻과 보아스","ref":"성경 이야기"},{"q":"야곱의 사닥다리 꿈","ref":"성경 이야기"},{"q":"요셉의 꿈과 용서","ref":"성경 이야기"},{"q":"엘리야와 갈멜산","ref":"성경 이야기"},{"q":"나아만의 요단강 씻음","ref":"성경 이야기"},{"q":"삭개오와 뽕나무","ref":"성경 이야기"},{"q":"선한 사마리아인","ref":"성경 이야기"},{"q":"탕자의 귀환","ref":"성경 이야기"},{"q":"오병이어의 기적","ref":"성경 이야기"},{"q":"가나 혼인잔치","ref":"성경 이야기"},{"q":"베드로의 물 위 걷기","ref":"성경 이야기"},{"q":"풍랑을 잠잠케 하신 예수님","ref":"성경 이야기"},{"q":"중풍병자와 네 친구","ref":"성경 이야기"},{"q":"나사로의 부활","ref":"성경 이야기"},{"q":"맹인 바디매오","ref":"성경 이야기"},{"q":"혈루증 여인의 치유","ref":"성경 이야기"},{"q":"열 명의 나병환자","ref":"성경 이야기"},{"q":"마지막 만찬","ref":"성경 이야기"},{"q":"겟세마네 기도","ref":"성경 이야기"},{"q":"예수님의 십자가","ref":"성경 이야기"},{"q":"예수님의 부활","ref":"성경 이야기"},{"q":"도마의 의심","ref":"성경 이야기"},{"q":"엠마오 길의 두 제자","ref":"성경 이야기"},{"q":"예수님의 승천","ref":"성경 이야기"},{"q":"오순절 성령 강림","ref":"성경 이야기"},{"q":"바울과 실라의 감옥 찬송","ref":"성경 이야기"},{"q":"바울의 회심","ref":"성경 이야기"},{"q":"베드로의 첫 설교","ref":"성경 이야기"},{"q":"스데반의 순교","ref":"성경 이야기"},{"q":"빌립과 에티오피아 관리","ref":"성경 이야기"},{"q":"아브라함과 별","ref":"성경 이야기"},{"q":"이삭을 바치려는 아브라함","ref":"성경 이야기"},{"q":"아기 모세와 갈대상자","ref":"성경 이야기"},{"q":"불타는 떨기나무","ref":"성경 이야기"},{"q":"광야의 만나","ref":"성경 이야기"},{"q":"발람의 나귀","ref":"성경 이야기"},{"q":"기드온의 횃불","ref":"성경 이야기"},{"q":"사무엘의 부르심","ref":"성경 이야기"},{"q":"솔로몬의 지혜로운 재판","ref":"성경 이야기"},{"q":"다윗의 춤","ref":"성경 이야기"},{"q":"엘리사의 도끼","ref":"성경 이야기"},{"q":"사르밧 과부의 기름","ref":"성경 이야기"},{"q":"히스기야의 기도","ref":"성경 이야기"},{"q":"느헤미야의 성벽 재건","ref":"성경 이야기"},{"q":"마른 뼈의 환상","ref":"성경 이야기"},{"q":"동방박사와 별","ref":"성경 이야기"},{"q":"목자들의 성탄 소식","ref":"성경 이야기"},{"q":"세례 요한의 세례","ref":"성경 이야기"},{"q":"예수님의 산상수훈","ref":"성경 이야기"},{"q":"예수님과 어린아이들","ref":"성경 이야기"},{"q":"무화과나무를 꾸짖으신 예수님","ref":"성경 이야기"},{"q":"성전 정화","ref":"성경 이야기"},{"q":"과부의 두 렙돈","ref":"성경 이야기"},{"q":"열 처녀의 등불","ref":"성경 이야기"},{"q":"달란트 비유","ref":"성경 이야기"},{"q":"잃은 양을 찾는 목자","ref":"성경 이야기"},{"q":"씨 뿌리는 사람","ref":"성경 이야기"},{"q":"겨자씨의 비유","ref":"성경 이야기"},{"q":"제자들을 부르신 예수님","ref":"성경 이야기"},{"q":"예수님이 제자들의 발을 씻김","ref":"성경 이야기"},{"q":"엘리야와 까마귀","ref":"성경 이야기"},{"q":"엘리사의 기름병 기적","ref":"성경 이야기"},{"q":"요셉이 애굽 총리가 됨","ref":"성경 이야기"},{"q":"이스라엘의 출애굽","ref":"성경 이야기"},{"q":"여호수아의 기도","ref":"성경 이야기"},{"q":"아론의 지팡이","ref":"성경 이야기"},{"q":"에스겔의 마른 뼈","ref":"성경 이야기"},{"q":"마리아와 천사 가브리엘","ref":"성경 이야기"},{"q":"사가랴와 아기 요한","ref":"성경 이야기"},{"q":"시므온과 아기 예수","ref":"성경 이야기"},{"q":"베드로가 예수님을 세 번 부인","ref":"성경 이야기"},{"q":"유다의 배신","ref":"성경 이야기"},{"q":"빌라도의 손 씻기","ref":"성경 이야기"},{"q":"예수님이 나귀 타고 입성","ref":"성경 이야기"},{"q":"부활하신 예수님을 만난 마리아","ref":"성경 이야기"},{"q":"베드로와 성전 미문 앉은뱅이","ref":"성경 이야기"},{"q":"바울과 유두고","ref":"성경 이야기"},{"q":"베드로의 보자기 환상","ref":"성경 이야기"},{"q":"바울과 독사","ref":"성경 이야기"},{"q":"요한의 밧모섬 환상","ref":"성경 이야기"},{"q":"아담과 하와","ref":"성경 이야기"},{"q":"가인과 아벨","ref":"성경 이야기"},{"q":"바벨탑","ref":"성경 이야기"},{"q":"롯과 소돔","ref":"성경 이야기"},{"q":"레아와 라헬","ref":"성경 이야기"},{"q":"미리암의 노래","ref":"성경 이야기"},{"q":"여호수아와 갈렙의 포도송이","ref":"성경 이야기"},{"q":"엘리사가 나아만을 고침","ref":"성경 이야기"},{"q":"다윗이 물맷돌을 준비함","ref":"성경 이야기"},{"q":"예수님이 물고기 입에서 동전을 꺼냄","ref":"성경 이야기"}];let deck=[...QUESTIONS],i=0,score=0,scored=new Set();const E=id=>document.getElementById(id);function draw(){E('progress').textContent=(i+1)+' / '+deck.length;E('num').textContent='QUESTION '+String(i+1).padStart(2,'0');E('question').textContent=deck[i].q;E('answer').textContent='정답: '+deck[i].q;E('answer').classList.add('hide');E('reveal').textContent='정답 보기';E('prev').disabled=i===0;E('next').disabled=i===deck.length-1;E('score').textContent=score}E('reveal').onclick=()=>{E('answer').classList.toggle('hide');E('reveal').textContent=E('answer').classList.contains('hide')?'정답 보기':'정답 숨기기'};E('correct').onclick=()=>{if(!scored.has(i)){scored.add(i);score++;E('score').textContent=score}};E('prev').onclick=()=>{if(i>0){i--;draw()}};E('next').onclick=()=>{if(i<deck.length-1){i++;draw()}};E('shuffle').onclick=()=>{deck=[...QUESTIONS].sort(()=>Math.random()-.5);i=0;score=0;scored.clear();draw()};E('reset').onclick=()=>{deck=[...QUESTIONS];i=0;score=0;scored.clear();draw()};draw();</script><!-- 폰을 눕혀서 진행: 오른쪽 가운데 '다음 ▶', 바로 밑 '정답' 버튼 (가로 화면에서만) -->
<style>
.fabnav{display:none}
@media (orientation:landscape) and (max-height:600px),(orientation:landscape) and (pointer:coarse){
  .fabnav{position:fixed;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);z-index:9999;display:flex;flex-direction:column;gap:12px}
  .fabnav button{width:84px!important;min-width:84px;min-height:84px;padding:6px 4px!important;margin:0!important;white-space:nowrap;word-break:keep-all;letter-spacing:0;border:0;border-radius:20px;font:inherit;font-size:20px;font-weight:900;line-height:1.15;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .fabnav .fnext{background:#fbbf24;color:#1c1300;font-size:24px}
  .fabnav .fans{background:#fff;color:#1d2b6b;min-height:64px;font-size:18px}
  .fabnav button:active{transform:scale(.95)}
  body{padding-right:calc(104px + env(safe-area-inset-right))!important}
}
</style>
<div class="fabnav" aria-label="빠른 넘기기"><button type="button" class="fnext" id="fabNext">다음<br>▶</button><button type="button" class="fans" id="fabAns">정답</button></div>
<script>
(function(){
  function find(re){return Array.prototype.find.call(document.querySelectorAll("main button, body > button, button"),function(b){return !b.closest(".fabnav")&&re.test(b.textContent.trim());});}
  document.getElementById("fabNext").onclick=function(){var b=find(/^다음/);if(b)b.click();};
  document.getElementById("fabAns").onclick=function(){var b=find(/정답/);if(b)b.click();};
})();
</script>
</body></html>
