name: 제주수양회 영상 자동 반영

# 시화산노회 채널에 '26년제주부부수양회' 제목 영상이 올라오면 jeju-2026/videos.json 에 더한다.
# 2026-12-31 이후에는 스크립트가 아무것도 하지 않는다 (이 파일을 지우면 완전히 멈춘다).
on:
  schedule:
    - cron: '17 * * * *'   # 매시간
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jeju-videos.yml'
      - 'scripts/jeju_videos_sync.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/jeju_videos_sync.py
      - name: 바뀐 것이 있으면 저장
        run: |
          git add jeju-2026/videos.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Jeju retreat videos from presbytery YouTube channel'
          git push
