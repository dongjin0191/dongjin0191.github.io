name: 제주수양회 당일사진 가져오기

# 구글 드라이브 '26년제주부부수양회' 폴더 안의 1일차·2일차·3일차 폴더 사진을 받아
# jeju-2026/days/d1~d3 에 줄여서 저장하고 days.json 을 만듭니다. 앱은 이 목록을 읽어 날짜별 칸에 보여 줍니다.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'   # 20분마다 드라이브를 다시 확인
  push:
    paths:
      - '.github/workflows/jeju-days.yml'
      - 'scripts/jeju_days_sync.py'

permissions:
  contents: write

env:
  # 1·2·3일차 드라이브 폴더 ID. 어느 날 칸에 넣을지는 드라이브 폴더 이름('1일차' 등)으로 정합니다.
  DRIVE_FOLDERS: '1k65Q-M3WpKGcdbCLZNBCkteCBXVb8FNP 1jWjJUUJHrsGIBvb2UBs3cC65s49y2Uvw 1YktY8A_5ybxP9Q4eJSWfbI-ebtWLmdZ3'

concurrency:
  group: jeju-days
  cancel-in-progress: false

jobs:
  days:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdown pillow pillow-heif
      - name: 새 사진만 받아서 이어 붙이기
        run: python scripts/jeju_days_sync.py
      - name: 저장
        run: |
          git add jeju-2026/days
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Jeju retreat day photos from Google Drive'
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
