name: 제주수양회 답사사진 가져오기

# 구글 드라이브 '사전답사사진' 공유 폴더의 사진을 받아 jeju-2026/photos 에 줄여서 저장합니다.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'   # 매시 17분에 드라이브를 다시 확인
  push:
    paths:
      - '.github/workflows/jeju-photos.yml'

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdown pillow pillow-heif
      - name: 드라이브 폴더 내려받기
        run: gdown --folder "https://drive.google.com/drive/folders/1SEcLwN5OF8Q0FdEePYLkwIaJ-pfIVs4h" -O /tmp/drive/
      - name: 사진 줄이기
        run: |
          python - <<'PY'
          import os, json
          from PIL import Image, ImageOps
          from pillow_heif import register_heif_opener
          register_heif_opener()
          src, out = "/tmp/drive", "jeju-2026/photos"
          os.makedirs(out, exist_ok=True)
          for old in os.listdir(out):
              if old.endswith(".jpg"): os.remove(os.path.join(out, old))
          files = []
          for root, _, names in os.walk(src):
              for n in names:
                  if n.lower().rsplit(".", 1)[-1] in ("jpg", "jpeg", "png", "heic", "heif", "webp"):
                      files.append(os.path.join(root, n))
          import re
          nat = lambda f: [int(x) if x.isdigit() else x for x in re.split(r"(\d+)", os.path.relpath(f, src))]
          files.sort(key=nat)
          items = []
          for i, f in enumerate(files, 1):
              try:
                  im = ImageOps.exif_transpose(Image.open(f)).convert("RGB")
              except Exception as e:
                  print("skip", f, e); continue
              im.thumbnail((1280, 1280))
              name = "p%03d.jpg" % i
              im.save(os.path.join(out, name), quality=80, optimize=True)
              stem = os.path.splitext(os.path.basename(f))[0]
              m = re.match(r"(\d{4})(\d\d)(\d\d)", stem)
              cap = ("%d/%d 사전답사" % (int(m.group(2)), int(m.group(3)))) if m else stem
              items.append({"src": name, "cap": cap})
          json.dump(items, open(os.path.join(out, "photos.json"), "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(len(items), "photos")
          PY
      - name: 저장
        run: |
          git add jeju-2026/photos
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Jeju retreat survey photos from Google Drive'
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
