name: 제주수양회 영상 썸네일 받기 (1회)

# 이 파일이 올라올 때 한 번만 돌아 유튜브 썸네일을 jeju-2026/thumbs 에 저장한다.
on:
  push:
    paths:
      - '.github/workflows/jeju-thumbs.yml'

permissions:
  contents: write

jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p jeju-2026/thumbs
          for id in p6tjJwH1cbY k_Tfscc35S4; do
            curl -fsSL -o jeju-2026/thumbs/$id.jpg https://i.ytimg.com/vi/$id/hqdefault.jpg
          done
          ls -la jeju-2026/thumbs
          git add jeju-2026/thumbs
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fetch Jeju retreat video thumbnails' && git push
