name: 라파일정표 구독 캘린더(ics) 자동 생성

on:
  push:
    branches: [main]
    paths: ['rapa-schedule/events.json', 'scripts/rapa_schedule_ics.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/rapa_schedule_ics.py
      - name: 바뀐 것이 있으면 저장
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add rapa-schedule/events.ics
          git commit -m 'rapa-schedule: regenerate events.ics from events.json'
          git push
