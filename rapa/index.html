<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2433">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="라파의 모든것">
<title>라파의 모든것</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d2433;--ink2:#5a6170;--line:#e4dfd6;--acc:#b8892f}
@media (prefers-color-scheme:dark){:root{--bg:#14171e;--card:#1e222c;--ink:#eef0f4;--ink2:#a2a8b5;--line:#2e3340;--acc:#e0b55c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;padding:12px 4px 18px}
header img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--acc)}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:13px}
h2{font-size:14px;color:var(--ink2);font-weight:700;margin:22px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
a.app{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;color:inherit;text-decoration:none;min-width:0}
a.app:active{transform:scale(.98)}
a.app img{width:44px;height:44px;border-radius:11px;flex:none}
a.app b{display:block;font-size:14px;font-weight:700;line-height:1.3}
a.app small{display:block;font-size:11px;color:var(--ink2);margin-top:2px}
a.app div{min-width:0}
.lock{font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700}
.note{font-size:12px;color:var(--ink2);margin:22px 4px 0;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<header><img src="icon-192.png" alt="라파 이동진 목사"><div><h1>라파의 모든것</h1><div class="sub">내가 만든 대시보드를 한곳에</div></div></header>
<div id="list"></div>
<p class="note">🔒 표시는 자료를 공개 저장소에 두지 않고 Claude에 보관된 원본을 여는 앱입니다. 앱마다 각각 홈 화면에 추가할 수도 있어요.</p>
</div>
<script>
var GROUPS=[
 ['생활 · 재정',[
  ['ledger','라파네 가계부','통장·카드·지출 분석',1],
  ['gyeongjosa','경조사 장부','보낸·받은 경조사'],
  ['glucose','혈당·인슐린 기록','건강 기록'],
  ['church-finance','함께걷는교회 재정','월별 재정 보고',1],
  ['rapamulti','라파멀티엔터 재무표','사업 매출·장부',1]]],
 ['사역 · 설교',[
  ['sermons','라파목사이동진의 설교','2003~ 설교 모음',1],
  ['haengsaji','행사지 목록표','연도별 행사지',1],
  ['youtube','동기연티비 영상 모음','동탄기독교연합회 영상'],
  ['namboo','남부시찰 영상 모음','라파티비'],
  ['hwagichong','한해동안 돌아보는 화기총','화성시기독교총연합회']]],
 ['정관 · 교회',[
  ['jeonggwan','동탄기독교연합회 정관','모바일 열람'],
  ['hwagichong/jeonggwan','화성시기독교총연합회 정관','모바일 열람'],
  ['','영광교회','교회 홈페이지','images/']]]
];
var h='';
GROUPS.forEach(function(g){
  h+='<h2>'+g[0]+'</h2><div class="grid">';
  g[1].forEach(function(a){
    var base='../'+(a[0]?a[0]+'/':''), icon=base+(a[3]==='images/'?'images/':'')+'icon-192.png';
    h+='<a class="app" href="'+base+'"><img src="'+icon+'" alt=""><div><b>'+a[1]+(a[3]===1?' <span class="lock">🔒</span>':'')+'</b><small>'+a[2]+'</small></div></a>';
  });
  h+='</div>';
});
document.getElementById('list').innerHTML=h;
// 연결 링크(#links=...)로 들어오면 이 폰에 Claude 원본 주소를 저장한다. 주소는 저장소에 없다.
(function(){
  var m=location.hash.match(/^#links=(.+)$/); if(!m) return;
  try{
    var add=JSON.parse(decodeURIComponent(m[1])), cur={};
    try{cur=JSON.parse(localStorage.getItem('rapa.links')||'{}')}catch(e){}
    for(var k in add) if(/^[A-Za-z0-9]{10,40}$/.test(add[k])) cur[k]=add[k];
    localStorage.setItem('rapa.links',JSON.stringify(cur));
    history.replaceState(null,'',location.pathname);
    var t=document.createElement('div');t.className='toast';t.textContent='이 폰에 연결했어요';document.body.appendChild(t);setTimeout(function(){t.remove()},2500);
  }catch(e){}
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
