<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수양회 단톡</title>
<meta name="theme-color" content="#FEE500">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="수양회 단톡">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
  // 홈 화면 아이콘으로 열었을 때는 곧바로 단톡방으로 넘어갑니다.
  var CHAT = "https://open.kakao.com/o/gqvWzxTi";
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
  if (standalone || /[?&]go=1/.test(location.search)) location.replace(CHAT);
</script>
<style>
  :root { color-scheme: light; --mag: #c2255c; }
  body { margin: 0; font-family: system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #fdf8ec; color: #2a2a2a; }
  /* 가이드북 '홈 화면 바로가기 추가'와 같은 설치 화면 */
  #appgo { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #fdf8ec; }
  #appgo img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  #appgo h2 { margin: 0; font-size: 22px; color: #1d2b6b; }
  #appgo p { margin: 0; max-width: 320px; font-size: 15.5px; line-height: 1.6; word-break: keep-all; }
  #appgo ol { margin: 0; padding: 0 0 0 22px; max-width: 320px; text-align: left; font-size: 16px; line-height: 1.7; }
  #appgo b { color: var(--mag); }
  #appgo .go { border: 0; border-radius: 14px; padding: 16px 40px; background: var(--mag); color: #fff; font: inherit; font-weight: 800; font-size: 19px; }
  #appgo .go[hidden] { display: none; }
  #appgo .enter { color: #3A1D1D; background: #FEE500; border-radius: 12px; padding: 12px 22px; font-weight: 800; text-decoration: none; }
  #appgo .note { font-size: 13.5px; color: #555; }
  #appgo .arrow { position: absolute; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); font-size: 34px; color: var(--mag); animation: bob 1s ease-in-out infinite alternate; }
  #appgo .arrow.br { left: auto; right: 22px; transform: none; }
  #appgo .arrow.tr { top: calc(8px + env(safe-area-inset-top, 0px)); bottom: auto; left: auto; right: 22px; transform: none; }
  #appgo .arrow[hidden] { display: none; }
  @keyframes bob { from { margin-bottom: 0; } to { margin-bottom: 10px; } }
</style>
</head>
<body>
<div id="appgo" role="dialog" aria-label="수양회 단톡방 아이콘 설치">
  <img src="icon-192.png" alt="">
  <h2>수양회 단톡방 아이콘 설치</h2>
  <p id="appmsg">아래 버튼을 누르고 <b>설치</b>를 누르면<br>홈 화면에 <b>수양회 단톡</b> 아이콘이 생겨요.</p>
  <button class="go" id="appbtn" type="button">설치하기</button>
  <a class="enter" href="https://open.kakao.com/o/gqvWzxTi">💬 지금 단톡방 입장</a>
  <p class="note">※ 아이콘이 <b>어플방(앱 목록)</b>에만 생기면, 어플방에서 아이콘을 길게 눌러 <b>홈 화면에 추가</b>를 눌러 주세요.<br>아이콘을 누르면 바로 단톡방이 열립니다.</p>
  <div class="arrow" id="apparrow" hidden>↓</div>
</div>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
  var ua = navigator.userAgent || "", deferred = null;
  var isKakao = /KAKAOTALK/i.test(ua), isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var msg = document.getElementById("appmsg"), gobtn = document.getElementById("appbtn");
  var SELF = location.origin + location.pathname + "?install=1";
  var andHelp = "<b>크롬</b> 오른쪽 위 <b>⋮ 메뉴</b>에서 <b>홈 화면에 추가</b>(또는 앱 설치)를 선택하세요.";
  var iosGuide = function () {
    var iPad = /iPad/.test(ua) || /Macintosh/.test(ua), v = +((ua.match(/Version\/(\d+)/) || [])[1] || 0);
    var add = "<li><b>홈 화면에 추가</b>를 누르세요. (안 보이면 목록을 아래로 내려 보세요)</li><li>오른쪽 위 <b>추가</b>를 누르면 끝!</li>";
    if (/CriOS|EdgiOS|FxiOS/.test(ua)) return { steps: "<li>주소창 오른쪽 <b>공유 버튼(□↑)</b>을 누르세요.</li>" + add, arrow: "tr" };
    if (!/Safari\//.test(ua) || /NAVER|DaumApps|Whale|Line\//.test(ua)) return { steps: "<li>오른쪽 아래(또는 위) <b>··· 메뉴</b>에서 <b>Safari로 열기</b>를 누르세요.</li><li>사파리에서 열리면 <b>설치하기</b>를 다시 누르세요.</li>", arrow: "" };
    if (iPad) return { steps: "<li>오른쪽 위 <b>공유 버튼(□↑)</b>을 누르세요.</li>" + add, arrow: "tr" };
    if (v >= 26) return { steps: "<li>아래 오른쪽 <b>··· 버튼</b>을 누르고 <b>공유</b>를 누르세요.</li>" + add, arrow: "br" };
    return { steps: "<li>아래 가운데 <b>공유 버튼(□↑)</b>을 누르세요.</li>" + add, arrow: "c" };
  };
  // 카톡 안 창: 크롬(안드로이드)·사파리(아이폰)로 한 번에 넘김
  var toBrowser = function () {
    if (isAndroid) location.href = "intent://" + SELF.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent("kakaotalk://web/openExternal?url=" + encodeURIComponent(SELF)) + ";end";
    else location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(SELF);
    msg.innerHTML = isAndroid ? "크롬으로 여는 중이에요…" : "사파리로 여는 중이에요…";
    setTimeout(function () { if (!document.hidden) msg.innerHTML = "자동으로 안 열리면 오른쪽 위(또는 아래) <b>⋮ 메뉴</b>에서 <b>다른 브라우저로 열기</b>를 눌러주세요."; }, 2500);
  };
  var tryPrompt = function () {
    if (!deferred) return false;
    var d = deferred;
    Promise.resolve().then(function () { return d.prompt(); }).then(function () { return d.userChoice; }).then(function (c) {
      if (c && c.outcome === "accepted") { deferred = null; msg.innerHTML = "✅ 설치됐어요. 홈 화면(또는 어플방)의 <b>수양회 단톡</b> 아이콘을 누르면 단톡방이 열립니다."; gobtn.hidden = true; }
    }).catch(function () {});
    return true;
  };
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; setTimeout(tryPrompt, 0); });
  window.addEventListener("appinstalled", function () { msg.innerHTML = "✅ 설치됐어요. <b>수양회 단톡</b> 아이콘을 누르면 단톡방이 열립니다."; gobtn.hidden = true; });
  if (isIOS) {
    var g = iosGuide(), ar = document.getElementById("apparrow");
    var ol = document.createElement("ol"); ol.id = "appmsg"; ol.innerHTML = g.steps; msg.replaceWith(ol); msg = ol; gobtn.hidden = true;
    if (g.arrow) { ar.className = "arrow" + (g.arrow === "c" ? "" : " " + g.arrow); ar.textContent = g.arrow === "tr" ? "↑" : "↓"; ar.hidden = false; }
  }
  if (isKakao) toBrowser();
  gobtn.addEventListener("click", function () {
    if (isKakao) return toBrowser();
    if (tryPrompt()) return;
    if (isAndroid) {
      // 크롬이 설치 준비를 마칠 때까지 잠깐 기다렸다가 바로 설치 창을 띄운다
      msg.innerHTML = "설치 준비 중이에요… 잠시만요";
      var waited = 0, iv = setInterval(function () {
        waited += 250;
        if (deferred) { clearInterval(iv); tryPrompt(); }
        else if (waited >= 4000) { clearInterval(iv); msg.innerHTML = andHelp; gobtn.hidden = true; }
      }, 250);
    } else { msg.innerHTML = "휴대폰의 크롬이나 사파리에서 열어주세요."; gobtn.hidden = true; }
  });
  if (/[?&](install|app|chrome)=1/.test(location.search)) history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
