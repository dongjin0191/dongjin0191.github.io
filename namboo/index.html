}
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st.c=b.dataset.k;render();window.scrollTo({top:document.querySelector('.toolbar').offsetTop,behavior:'smooth'})});
document.getElementById('main').addEventListener('click',e=>{const b=e.target.closest('[data-more]');if(!b)return;opened.add(b.dataset.more);render()});
let tm;document.getElementById('q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=e.target.value.trim();render()},150)});
yr.addEventListener('change',e=>{st.y=e.target.value;render()});
document.getElementById('pls').innerHTML=D.playlists.filter(p=>p.n).sort((a,b)=>b.n-a.n).map(p=>`<a class="pl" href="https://www.youtube.com/playlist?list=${p.id}" target="_blank" rel="noopener">${esc(p.t)}<small>${p.n}개</small></a>`).join('');
const toTop=document.getElementById('top');addEventListener('scroll',()=>{toTop.style.display=scrollY>600?'block':'none'},{passive:true});toTop.onclick=()=>scrollTo({top:0,behavior:'smooth'});
render();
