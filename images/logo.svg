<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1440" role="img" aria-label="영광교회 로고">
  <title>영광교회</title>
  <!-- 열린 문(두 문짝) + 십자가. 파랑 왼쪽 문짝, 녹색 오른쪽 문짝, 흰 십자가는 여백. -->
  <!-- 왼쪽(파랑) 문짝 -->
  <path d="M112 252 L470 330 L470 1096 L112 1204 Q100 1208 100 1194 L100 264 Q100 250 112 252 Z" fill="#29abe2"/>
  <!-- 오른쪽(녹색) 문짝 -->
  <path d="M554 330 L912 252 Q924 250 924 264 L924 1310 Q924 1326 910 1330 L554 1250 Z" fill="#6cb33f"/>
  <!-- 흰 십자가 (두 문짝 사이 여백 + 가로대) -->
  <g fill="#ffffff">
    <rect x="470" y="330" width="84" height="920"/>
    <rect x="270" y="590" width="484" height="96"/>
  </g>
</svg>
