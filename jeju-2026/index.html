<script type="application/json" id="guide">[{"id": "c0a", "day": "1일차 새벽 · 김포공항", "title": "집결 · 탑승 안내", "mv": "🚶 김포공항 국내선 · 05:30 집결", "quiz": [], "ment": "좋은 아침입니다. 새벽 5시 30분, 김포공항 국내선에 모여 주셔서 감사합니다. 먼저 신분증 원본을 꺼내 손에 들고 계세요. 사본이나 사진은 안 됩니다. 5시 40분부터 바이오패스 등록을 함께 하고, 6시 5분까지 마칩니다. 이미 등록하신 분은 옆에서 다른 분을 도와주세요. 우리 비행기는 6시 45분 이스타 ZE201편이고, 제주에는 8시에 도착합니다. 종이 탑승권은 비행기가 이륙을 기다리는 동안 임원이 걷어 가니 버리지 말고 가지고 계세요. 제주에 내리면 탐나는전 지원금을 받고 8시 15분에 버스에 탑니다. 꼭 해야 할 것 하나! 제주공항에 도착하면 캐리어에서 선물을 꺼내 버스에 따로 가져갑니다. 친교의 시간에 쓰입니다. 화장실은 탑승 전에 미리 다녀오시고, 일행을 놓치지 않도록 임원을 따라와 주세요."}, {"id": "c0", "day": "1일차 · 김포→제주", "title": "출발 · 어서 오세요, 제주", "ment": "공항에서 아침 식사할 해장국집까지는 약 2km, 버스로 10분 거리입니다. 사랑하는 목사님, 장로님, 사모님들, 새벽 일찍 나오시느라 정말 수고 많으셨습니다. 제주 말로 '혼저 옵서예', 어서 오시라는 인사로 첫 버스를 엽니다. 08:00에 제주에 내리자마자 탐나는전 지원금을 받으셨지요. 종이 탑승권은 비행기 이륙 대기 중에 임원이 거두었고, 명단은 신청서 순서(탐나순)로 불렀습니다. 혹시 아직 탑승권을 안 내신 분은 지금 임원에게 주세요. 캐리어에서 선물 꺼내 버스에 따로 가져오셨지요? 혹시 못 꺼내신 분은 해장국집에서 내릴 때 꼭 챙겨 주세요. 이제 아침부터 드시겠습니다. 버스로 10분 거리, 공항 앞 순풍삼대해장국입니다. 고사리육내탕(얼큰), 소고기해장국(선지 O), 소고기해장국(선지 X), 돼지국밥 가운데 가이드북에서 미리 고르신 메뉴로 나옵니다. 이번 2박 3일은 일보다 쉼, 회의보다 교제, 그리고 무엇보다 부부가 함께 걷는 시간입니다. 시편 133편 말씀처럼 형제가 연합하여 동거함이 얼마나 선하고 아름다운지, 이 길 위에서 함께 누리시길 바랍니다. 버스 출발 기도로 첫 일정을 시작하겠습니다. 식사 후 9시 10분까지 버스로 돌아와 주세요.", "quiz": [["김포공항에서 제주공항까지 비행 거리는 대략 몇 km일까요?"], ["김포~제주 노선은 세계 항공 노선 중 승객 수로 몇 위에 자주 꼽힐까요?"], ["제주 말 '혼저 옵서예'는 무슨 뜻일까요?"], ["제주를 '삼다도'라고 부릅니다. 많은 세 가지는?"], ["반대로 '삼무'는 없는 세 가지입니다. 무엇일까요?"], ["대문 대신 걸치던 나무 막대 '정낭'이 세 개 다 걸쳐 있으면 무슨 뜻일까요?"], ["제주도 넓이는 서울의 약 몇 배일까요?"], ["(제주 넌센스) 제주 분이 '혼저 옵서예' 했는데 혼자 왔다면 혼날까요?"], ["(제주 넌센스) 제주 말 '폭삭 속았수다'를 들으면 사기당한 걸까요?"], ["(제주 상식) 옛말에 '말은 나면 제주로 보내고, 사람은 나면 어디로 보내라' 했을까요?"], ["(성경 넌센스) 성경에서 가장 긴 이름을 가진 아이는? (힌트: 이사야의 아들)"], ["(성경 넌센스) 성경에서 가장 오래 산 사람의 아버지는 죽지 않았습니다. 누구일까요?"]], "mv": "✈ 김포 → 제주 약 450km · 비행 약 1시간 10분"}, {"id": "c1", "day": "1일차 오전", "title": "무지개 해안도로 · 어영공원", "ment": "해장국집에서 어영공원까지 약 4km, 버스로 약 15분 갑니다. 아침 드셨으니 첫 코스, 공항 바로 옆 바닷길 어영공원입니다. 해안도로를 따라 알록달록한 무지개 색 방호석이 길게 이어져서 '무지개 해안도로'라는 이름이 붙었습니다. 공항이 가까워 머리 위로 비행기가
