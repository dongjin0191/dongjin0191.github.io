<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7a3e1d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="행사지"><title>행사지 목록표</title><style>body{margin:0;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#7a3e1d;color:#222;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}.c{background:#fff;border-radius:20px;padding:28px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.15)}img{width:84px;height:84px;border-radius:20px}h1{font-size:20px;margin:14px 0 6px}p{font-size:13px;color:#666;margin:0 0 18px;line-height:1.6}a{display:block;background:#222;color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:14px}</style></head><body>
